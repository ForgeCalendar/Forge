services:
  # Migration service - runs once to apply database migrations
  migration:
    image: ghcr.io/forgecalendar/forge-migration:latest
    volumes:
      - forge-data:/data
    environment:
      - DATABASE_URL=file:/data/prod.db

  # Runtime service - the main application
  app:
    image: ghcr.io/forgecalendar/forge:latest
    ports:
      - "3000:3000"
    volumes:
      - forge-data:/data
    environment:
      - DATABASE_URL=file:/data/prod.db
      # Required: Cookie signing secret — generate with: openssl rand -base64 32
      - COOKIE_SECRET=REPLACE_WITH_OUTPUT_OF_openssl_rand_base64_32
    depends_on:
      migration:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  forge-data:

name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # Build images natively on each architecture
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set image name to lowercase
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push migration image for this architecture
      - name: Build and push migration image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: migration
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-migration:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=migration-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=migration-${{ matrix.arch }}
          platforms: ${{ matrix.platform }}

      # Build and push runtime image for this architecture
      - name: Build and push runtime image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: runner
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=runtime-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=runtime-${{ matrix.arch }}
          platforms: ${{ matrix.platform }}

  # Merge architecture-specific images into multi-arch manifests
  merge:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Set image name to lowercase
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata for migration image
      - name: Extract Docker metadata (migration)
        id: meta-migration
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-migration
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      # Extract metadata for runtime image
      - name: Extract Docker metadata (runtime)
        id: meta-runtime
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      # Create and push multi-arch manifest for migration image
      - name: Create multi-arch manifest (migration)
        run: |
          # Get all tags and create manifests for each
          echo "${{ steps.meta-migration.outputs.tags }}" | while read -r tag; do
            echo "Creating manifest for: $tag"
            docker buildx imagetools create -t "$tag" \
              "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-migration:${{ github.sha }}-amd64" \
              "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-migration:${{ github.sha }}-arm64"
          done

      # Create and push multi-arch manifest for runtime image
      - name: Create multi-arch manifest (runtime)
        run: |
          # Get all tags and create manifests for each
          echo "${{ steps.meta-runtime.outputs.tags }}" | while read -r tag; do
            echo "Creating manifest for: $tag"
            docker buildx imagetools create -t "$tag" \
              "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-amd64" \
              "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-arm64"
          done

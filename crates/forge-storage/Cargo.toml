[package]
name = "forge-storage"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
chrono-tz = "0.10"
sqlx = { version = "0.9.1", default-features = false, features = ["any", "macros", "migrate", "postgres", "runtime-tokio", "sqlite", "tls-rustls-ring-native-roots"] }
thiserror = "2.0"
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
tempfile = "3.23"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }

[package]
name = "forge-storage"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
chrono-tz = "0.10"
sea-orm = { version = "2.0.4", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres", "sqlx-sqlite", "with-chrono"] }
sea-orm-migration = { version = "2.0.4", default-features = false }
thiserror = "2.0"
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
tempfile = "3.23"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }
